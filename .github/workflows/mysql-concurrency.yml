name: MySQL Concurrency

on:
  push:
    branches:
      - main
    paths:
      - 'app/Application/Sites/**'
      - 'app/Domain/Sites/**'
      - 'app/Infrastructure/Activity/**'
      - 'app/Infrastructure/OAuth/**'
      - 'config/bridge.php'
      - 'config/database.php'
      - 'config/oauth.php'
      - 'database/migrations/**'
      - 'tests/Feature/OAuth/**'
      - 'tests/Feature/Sites/**'
      - 'tests/Support/site_lifecycle_concurrent_action.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/mysql-concurrency.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'app/Application/Sites/**'
      - 'app/Domain/Sites/**'
      - 'app/Infrastructure/Activity/**'
      - 'app/Infrastructure/OAuth/**'
      - 'config/bridge.php'
      - 'config/database.php'
      - 'config/oauth.php'
      - 'database/migrations/**'
      - 'tests/Feature/OAuth/**'
      - 'tests/Feature/Sites/**'
      - 'tests/Support/site_lifecycle_concurrent_action.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/mysql-concurrency.yml'

permissions:
  contents: read

concurrency:
  group: mysql-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-concurrency:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mcp_gateway_test
          MYSQL_USER: mcp_gateway
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate MySQL migration path
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan migrate:fresh --force

      - name: Run MySQL OAuth and site-lifecycle concurrency tests
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan test --group=mysql-concurrency
