name: MariaDB Concurrency

on:
  push:
    branches:
      - main
    paths:
      - 'app/Application/Access/**'
      - 'app/Application/Mcp/**'
      - 'app/Application/Sites/**'
      - 'app/Domain/Access/**'
      - 'app/Domain/Sites/**'
      - 'app/Http/Controllers/Admin/**'
      - 'app/Http/Middleware/RequireMcpAccessToken.php'
      - 'app/Http/Middleware/EnsureLocalUserAccessEnabled.php'
      - 'app/Infrastructure/OAuth/**'
      - 'app/Infrastructure/Activity/**'
      - 'app/Models/User.php'
      - 'routes/admin.php'
      - 'routes/oauth.php'
      - 'config/bridge.php'
      - 'config/database.php'
      - 'config/oauth.php'
      - 'database/migrations/**'
      - 'tests/Feature/Admin/AdminAuthorizationTest.php'
      - 'tests/Feature/Admin/UserAccessManagementTest.php'
      - 'tests/Feature/Admin/SiteGroup*'
      - 'tests/Feature/Mcp/SiteGroup*'
      - 'tests/Feature/OAuth/**'
      - 'tests/Feature/Sites/**'
      - 'tests/Feature/Security/Access*'
      - 'tests/Feature/Security/Activity*'
      - 'tests/Support/oauth_concurrent_token_request.php'
      - 'tests/Support/site_lifecycle_concurrent_action.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/database-concurrency.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'app/Application/Access/**'
      - 'app/Application/Mcp/**'
      - 'app/Application/Sites/**'
      - 'app/Domain/Access/**'
      - 'app/Domain/Sites/**'
      - 'app/Http/Controllers/Admin/**'
      - 'app/Http/Middleware/RequireMcpAccessToken.php'
      - 'app/Http/Middleware/EnsureLocalUserAccessEnabled.php'
      - 'app/Infrastructure/OAuth/**'
      - 'app/Infrastructure/Activity/**'
      - 'app/Models/User.php'
      - 'routes/admin.php'
      - 'routes/oauth.php'
      - 'config/bridge.php'
      - 'config/database.php'
      - 'config/oauth.php'
      - 'database/migrations/**'
      - 'tests/Feature/Admin/AdminAuthorizationTest.php'
      - 'tests/Feature/Admin/UserAccessManagementTest.php'
      - 'tests/Feature/Admin/SiteGroup*'
      - 'tests/Feature/Mcp/SiteGroup*'
      - 'tests/Feature/OAuth/**'
      - 'tests/Feature/Sites/**'
      - 'tests/Feature/Security/Access*'
      - 'tests/Feature/Security/Activity*'
      - 'tests/Support/oauth_concurrent_token_request.php'
      - 'tests/Support/site_lifecycle_concurrent_action.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/database-concurrency.yml'

permissions:
  contents: read

concurrency:
  group: database-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-concurrency:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: mcp_gateway_test
          MARIADB_USER: mcp_gateway
          MARIADB_PASSWORD: test-password
          MARIADB_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -umcp_gateway -ptest-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate MariaDB migration path
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan migrate:fresh --force

      - name: Run MariaDB OAuth and site-lifecycle concurrency tests
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan test --group=database-concurrency

      - name: Run MariaDB Activity hot-path tests
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan test --group=database-activity

      - name: Run MariaDB inventory query-plan tests
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan test --group=database-inventory

      - name: Run MariaDB access-control tests
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan test --group=database-access
