name: Release deployment package

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release-package.yml
      - bin/build-release-package.sh
      - bin/prune-production-vendor.php
      - bin/verify-release-package.sh

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate release source
        run: |
          composer validate --strict
          composer audit --locked
          composer check

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 1.1.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "package=mcp-gateway-v$version" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; package publication is already complete."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a matching release; refusing to move or replace it." >&2
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Build deployment ZIP from clean production staging
        if: steps.publish.outputs.needed == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: bash bin/build-release-package.sh "$PACKAGE"

      - name: Verify deployment ZIP contents and runtime
        if: steps.publish.outputs.needed == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: bash bin/verify-release-package.sh "dist/$PACKAGE.zip" "$PACKAGE"

      - name: Publish GitHub release
        if: steps.publish.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.release.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF
          MCP Gateway v$VERSION ships a clean deployment-only ZIP assembled in isolated production staging from the committed Composer lockfile.

          ## Recommended installation

          Download \`$PACKAGE.zip\`, upload/extract it on an HTTPS PHP 8.4 + MySQL host, point the domain document root to the extracted \`public/\` directory, then open \`/install\`.

          The deployment ZIP contains only install/runtime application files, production Composer dependencies, required runtime manifests/resources, license/notice material, version identity, and empty writable runtime directories. Repository metadata, development dependencies/tools, package docs/examples/tests, generated test keys, sessions, caches, logs, and other transient build state are not shipped.

          The package is boot-smoke-tested after extraction before publication. Git and Composer are not required on the target host. The Git/Composer/Artisan source installation path remains supported for advanced operators.

          No production server is deployed or modified by publishing this release.
          EOF
          gh release create "$TAG" \
            "dist/$PACKAGE.zip" \
            "dist/$PACKAGE.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "MCP Gateway $TAG" \
            --notes-file dist/release-notes.md
