name: Configuration Reference

on:
  push:
    branches:
      - main
    paths:
      - 'docs/CONFIGURATION.md'
      - '.github/workflows/configuration-reference.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'docs/CONFIGURATION.md'
      - '.github/workflows/configuration-reference.yml'

permissions:
  contents: read

concurrency:
  group: config-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify .env.example documentation inventory
        run: python3 bin/test-configuration-docs.py
