name: Release deployment package

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release-package.yml

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate release source
        run: |
          composer validate --strict
          composer audit --locked
          composer check

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 1.1.1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "package=mcp-gateway-v$version" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; package publication is already complete."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a matching release; refusing to move or replace it." >&2
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Install production dependencies
        if: steps.publish.outputs.needed == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Remove development runtime artifacts
        if: steps.publish.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf storage/framework/cache/phpstan
          rm -f .phpunit.result.cache .phpunit.cache/test-results
          find storage/framework/cache storage/framework/sessions storage/framework/views storage/logs \
            -type f ! -name '.gitignore' -delete

      - name: Build deployment ZIP
        if: steps.publish.outputs.needed == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          destination="dist/$PACKAGE"
          mkdir -p "$destination"

          cp -a \
            app \
            artisan \
            bootstrap \
            composer.json \
            composer.lock \
            config \
            database \
            LICENSE \
            public \
            resources \
            routes \
            storage \
            VERSION \
            vendor \
            .env.example \
            "$destination/"

          (
            cd dist
            zip -qr "$PACKAGE.zip" "$PACKAGE"
            sha256sum "$PACKAGE.zip" > "$PACKAGE.zip.sha256"
          )

      - name: Verify deployment ZIP contents
        if: steps.publish.outputs.needed == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          zip="dist/$PACKAGE.zip"

          required_paths=(
            "$PACKAGE/app/"
            "$PACKAGE/bootstrap/"
            "$PACKAGE/config/"
            "$PACKAGE/database/"
            "$PACKAGE/public/"
            "$PACKAGE/resources/"
            "$PACKAGE/routes/"
            "$PACKAGE/storage/"
            "$PACKAGE/vendor/autoload.php"
            "$PACKAGE/public/install.php"
            "$PACKAGE/artisan"
            "$PACKAGE/.env.example"
            "$PACKAGE/composer.json"
            "$PACKAGE/composer.lock"
            "$PACKAGE/LICENSE"
            "$PACKAGE/VERSION"
          )

          for path in "${required_paths[@]}"; do
            unzip -Z1 "$zip" | grep -Fx "$path" >/dev/null || {
              echo "Deployment ZIP is missing required path: $path" >&2
              exit 1
            }
          done

          cat > dist/expected-top-level.txt <<'EOF'
          .env.example
          LICENSE
          VERSION
          app
          artisan
          bootstrap
          composer.json
          composer.lock
          config
          database
          public
          resources
          routes
          storage
          vendor
          EOF

          unzip -Z1 "$zip" \
            | awk -F/ -v root="$PACKAGE" '$1 == root && NF >= 2 && $2 != "" { print $2 }' \
            | sort -u \
            > dist/actual-top-level.txt

          diff -u dist/expected-top-level.txt dist/actual-top-level.txt

      - name: Publish GitHub release
        if: steps.publish.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.release.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF
          MCP Gateway v$VERSION ships a trimmed deployment-only ZIP built from an explicit production runtime allowlist.

          ## Recommended installation

          Download \`$PACKAGE.zip\`, upload/extract it on an HTTPS PHP 8.4 + MySQL host, point the domain document root to the extracted \`public/\` directory, then open \`/install\`.

          The deployment ZIP contains the application runtime, installer, production Composer dependencies, dependency manifests, license and version identity only. Repository/development files are not packaged.

          Git and Composer are not required on the target host. The existing Git/Composer/Artisan installation path remains supported for advanced operators.

          No production server is deployed or modified by publishing this release.
          EOF
          gh release create "$TAG" \
            "dist/$PACKAGE.zip" \
            "dist/$PACKAGE.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "MCP Gateway $TAG" \
            --notes-file dist/release-notes.md
