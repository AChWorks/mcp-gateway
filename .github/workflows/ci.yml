name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'public/css/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'public/css/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --locked

      - name: Run code style check
        run: composer lint

      - name: Run static analysis
        run: composer analyse

      - name: Run test suite
        run: composer test

      - name: Validate live ChatGPT OAuth client metadata
        run: php artisan gateway:oauth-client-check --env=testing --refresh

      - name: Generate ephemeral Gateway OAuth signing keys
        env:
          APP_ENV: testing
        run: php artisan gateway:oauth-keygen --env=testing --force

      - name: Generate ephemeral Bridge client signing keys
        env:
          APP_ENV: testing
        run: php artisan gateway:bridge-client-keygen --env=testing --force

      - name: Validate runtime requirements
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan gateway:check

      - name: Build and verify release artifacts
        run: |
          bash bin/build-release-package.sh mcp-gateway-ci
          bash bin/verify-release-package.sh dist/mcp-gateway-ci.zip mcp-gateway-ci
          bash bin/build-update-package.sh mcp-gateway-update-ci dist/mcp-gateway-ci
          bash bin/verify-update-package.sh dist/mcp-gateway-update-ci.zip mcp-gateway-update-ci
