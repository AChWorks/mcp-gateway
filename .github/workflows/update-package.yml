name: Update Package

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - 'database/migrations/**'
      # Fresh-install policy and legacy fallback must pass release-baseline upgrades.
      - '.env.example'
      - 'app/Support/SimpleWebInstaller.php'
      - 'config/ssh.php'
      - composer.json
      - composer.lock
      - 'bin/build-release-package.sh'
      - 'bin/build-update-package.sh'
      - 'bin/validate-version.sh'
      - 'bin/test-released-baseline-parity.py'
      - 'bin/test_released_baseline_parity.py'
      - 'bin/check-candidate-artifact-reuse.sh'
      - 'bin/mcp-gateway-web-updater.php'
      - 'bin/mcp-gateway-web-recovery.php'
      - 'bin/update-managed-public-paths.txt'
      - 'bin/mcp-gateway-web-update-index.php'
      - 'public/.htaccess'
      - 'bin/prune-production-vendor.php'
      - 'bin/test-update-package.sh'
      - 'bin/test-updater-recovery.php'
      - 'bin/test-updater-postflight.php'
      - 'bin/test-update-backup-integrity.sh'
      - 'bin/verify-update-package.sh'
      - '.github/workflows/update-package.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - VERSION
      - 'database/migrations/**'
      # Fresh-install policy and legacy fallback must pass release-baseline upgrades.
      - '.env.example'
      - 'app/Support/SimpleWebInstaller.php'
      - 'config/ssh.php'
      - composer.json
      - composer.lock
      - 'bin/build-release-package.sh'
      - 'bin/build-update-package.sh'
      - 'bin/validate-version.sh'
      - 'bin/test-released-baseline-parity.py'
      - 'bin/test_released_baseline_parity.py'
      - 'bin/check-candidate-artifact-reuse.sh'
      - 'bin/mcp-gateway-web-updater.php'
      - 'bin/mcp-gateway-web-recovery.php'
      - 'bin/update-managed-public-paths.txt'
      - 'bin/mcp-gateway-web-update-index.php'
      - 'public/.htaccess'
      - 'bin/prune-production-vendor.php'
      - 'bin/test-update-package.sh'
      - 'bin/test-updater-recovery.php'
      - 'bin/test-updater-postflight.php'
      - 'bin/test-update-backup-integrity.sh'
      - 'bin/verify-update-package.sh'
      - '.github/workflows/update-package.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: update-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-from-released-baselines:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: mcp_gateway_test
          MARIADB_USER: mcp_gateway
          MARIADB_PASSWORD: test-password
          MARIADB_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -umcp_gateway -ptest-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2

      - name: Classify candidate versus stable version
        id: version_policy
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          bash bin/validate-version.sh package "$version"
          bash bin/test-version-policy.sh
          python3 bin/test-released-baseline-parity.py
          python3 bin/test_released_baseline_parity.py
          bash bin/test-github-release-notes.sh
          if bash bin/validate-version.sh candidate "$version" >/dev/null 2>&1; then
            echo 'is_candidate=true' >> "$GITHUB_OUTPUT"
          else
            # Stable promotion PRs can run all package/update checks,
            # but MUST NOT distribute stable-named "candidate" ZIPs.
            echo 'is_candidate=false' >> "$GITHUB_OUTPUT"
            echo 'Stable VERSION: no candidate artifact will be uploaded.'
          fi

      - name: Prevent distributing an already-used candidate VERSION
        if: github.event_name == 'pull_request' && steps.version_policy.outputs.is_candidate == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          bash bin/check-candidate-artifact-reuse.sh "$version" "$CANDIDATE_SHA"

      - name: Verify browser update state and lock fail-safes
        run: php bin/test-updater-recovery.php

      - name: Verify postflight cleanup cannot become a migration failure
        run: php bin/test-updater-postflight.php

      - name: Build and verify browser update candidate
        run: |
          bash bin/build-release-package.sh mcp-gateway-update-test-runtime
          bash bin/build-update-package.sh mcp-gateway-update-ci dist/mcp-gateway-update-test-runtime
          bash bin/verify-update-package.sh dist/mcp-gateway-update-ci.zip

      - name: Download released deployment baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/baseline
          for version in 1.1.2 1.1.10 1.2.1 2.0.0 2.0.1 2.0.2 2.0.3 2.1.2 2.2.0 2.2.1 2.3.0 2.3.1 2.3.2 2.3.3 2.3.4 2.3.5 2.3.6 2.3.7 2.3.8 2.3.9 2.3.10 2.3.11 2.3.12 2.4.0 2.4.1 2.4.2 2.5.0 2.5.1; do
            gh release download "v$version" \
              --pattern "mcp-gateway-v$version.zip*" \
              --dir dist/baseline
            (
              cd dist/baseline
              sha256sum --check --strict "mcp-gateway-v$version.zip.sha256"
            )
          done

      - name: Verify released-baseline browser updates
        env:
          UPDATE_TEST_DB_HOST: 127.0.0.1
          UPDATE_TEST_DB_PORT: 3306
          UPDATE_TEST_DB_DATABASE: mcp_gateway_test
          UPDATE_TEST_DB_USERNAME: mcp_gateway
          UPDATE_TEST_DB_PASSWORD: test-password
          UPDATE_TEST_REQUIRE_PROTECTED_PUBLIC: '1'
        run: |
          for version in 1.1.2 1.1.10 1.2.1 2.0.0 2.0.1 2.0.2 2.0.3 2.1.2 2.2.0 2.2.1 2.3.0 2.3.1 2.3.2 2.3.3 2.3.4 2.3.5 2.3.6 2.3.7 2.3.8 2.3.9 2.3.10 2.3.11 2.3.12 2.4.0 2.4.1 2.4.2 2.5.0 2.5.1; do
            bash bin/test-update-package.sh \
              dist/mcp-gateway-update-ci.zip \
              "dist/baseline/mcp-gateway-v$version.zip"
          done

      - name: Verify released-baseline backup integrity fail-safe
        env:
          UPDATE_TEST_DB_HOST: 127.0.0.1
          UPDATE_TEST_DB_PORT: 3306
          UPDATE_TEST_DB_DATABASE: mcp_gateway_test
          UPDATE_TEST_DB_USERNAME: mcp_gateway
          UPDATE_TEST_DB_PASSWORD: test-password
        run: |
          for version in 1.1.2 1.1.10 1.2.1 2.0.0 2.0.1 2.0.2 2.0.3 2.1.2 2.2.0 2.2.1 2.3.0 2.3.1 2.3.2 2.3.3 2.3.4 2.3.5 2.3.6 2.3.7 2.3.8 2.3.9 2.3.10 2.3.11 2.3.12 2.4.0 2.4.1 2.4.2 2.5.0 2.5.1; do
            bash bin/test-update-backup-integrity.sh \
              dist/mcp-gateway-update-ci.zip \
              "dist/baseline/mcp-gateway-v$version.zip"
          done

      - name: Prepare owner-test candidate artifacts
        if: github.event_name == 'pull_request' && steps.version_policy.outputs.is_candidate == 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          release_package="mcp-gateway-v$version"
          release_zip="$release_package.zip"
          update_zip="mcp-gateway-update-v$version.zip"
          bash bin/build-release-package.sh "$release_package"
          bash bin/verify-release-package.sh "dist/$release_zip" "$release_package"
          cp dist/mcp-gateway-update-ci.zip "dist/$update_zip"
          (
            cd dist
            sha256sum "$release_zip" > "$release_zip.sha256"
            sha256sum "$update_zip" > "$update_zip.sha256"
          )
          bash bin/verify-update-package.sh "dist/$update_zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=mcp-gateway-v$version-candidate-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload owner-test candidate artifacts
        if: github.event_name == 'pull_request' && steps.version_policy.outputs.is_candidate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          path: |
            dist/mcp-gateway-v${{ steps.candidate.outputs.version }}.zip
            dist/mcp-gateway-v${{ steps.candidate.outputs.version }}.zip.sha256
            dist/mcp-gateway-update-v${{ steps.candidate.outputs.version }}.zip
            dist/mcp-gateway-update-v${{ steps.candidate.outputs.version }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
