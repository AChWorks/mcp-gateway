name: Release deployment package

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release-package.yml
      - bin/build-release-package.sh
      - bin/build-update-package.sh
      - bin/mcp-gateway-web-updater.php
      - bin/mcp-gateway-web-update-index.php
      - bin/test-update-package.sh
      - bin/prune-production-vendor.php
      - bin/verify-release-package.sh
      - bin/verify-update-package.sh

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mcp_gateway_test
          MYSQL_USER: mcp_gateway
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate release source
        run: |
          composer validate --strict
          composer audit --locked
          composer check

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 1.1.5" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "package=mcp-gateway-v$version" >> "$GITHUB_OUTPUT"
          echo "update_package=mcp-gateway-update-v$version" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; package publication is already complete."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a matching release; refusing to move or replace it." >&2
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Build fresh-install deployment ZIP
        if: steps.publish.outputs.needed == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: bash bin/build-release-package.sh "$PACKAGE"

      - name: Verify fresh-install deployment ZIP
        if: steps.publish.outputs.needed == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: bash bin/verify-release-package.sh "dist/$PACKAGE.zip" "$PACKAGE"

      - name: Build browser update ZIP
        if: steps.publish.outputs.needed == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
        run: bash bin/build-update-package.sh "$UPDATE_PACKAGE" "dist/$PACKAGE"

      - name: Verify browser update ZIP
        if: steps.publish.outputs.needed == 'true'
        env:
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
        run: bash bin/verify-update-package.sh "dist/$UPDATE_PACKAGE.zip"

      - name: Download released v1.1.2 deployment baseline
        if: steps.publish.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/baseline
          gh release download v1.1.2 --pattern 'mcp-gateway-v1.1.2.zip' --dir dist/baseline

      - name: Verify released-baseline browser update
        if: steps.publish.outputs.needed == 'true'
        env:
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
          UPDATE_TEST_DB_HOST: 127.0.0.1
          UPDATE_TEST_DB_PORT: 3306
          UPDATE_TEST_DB_DATABASE: mcp_gateway_test
          UPDATE_TEST_DB_USERNAME: mcp_gateway
          UPDATE_TEST_DB_PASSWORD: test-password
        run: >-
          bash bin/test-update-package.sh
          dist/$UPDATE_PACKAGE.zip
          dist/baseline/mcp-gateway-v1.1.2.zip

      - name: Publish GitHub release
        if: steps.publish.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.release.outputs.package }}
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF_NOTES
          MCP Gateway v$VERSION ships two verified operator artifacts built from the same production runtime tree.

          ## Fresh installation

          Download \`$PACKAGE.zip\`, upload/extract it on an HTTPS PHP 8.4 + MySQL host, point the domain document root to the extracted \`public/\` directory, then open \`/install\`.

          ## Simple browser update

          Existing deployment-ZIP installations can update without SSH, Git, or Composer:

          1. Download \`$UPDATE_PACKAGE.zip\`.
          2. Upload it into the existing MCP Gateway application root — the directory containing \`.env\`, \`artisan\`, \`public/\`, and \`storage/\`.
          3. Extract the ZIP **in that application root**. Extraction only adds temporary \`update/\` and \`public/update/\` staging files; it does not replace the live application yet.
          4. Open \`https://your-gateway.example/update/\` in a browser.
          5. Sign in with the existing Gateway administrator account if prompted, review the preflight, and click **Update MCP Gateway**.

          The browser updater verifies the package and target, preserves \`.env\` and persistent \`storage/\`, creates a bounded private code backup, replaces application-managed files deterministically, clears Laravel caches, applies migrations, runs \`gateway:check\`, returns the Gateway to service, and removes its temporary \`update/\` + \`public/update/\` staging automatically after success. When the canonical uploaded ZIP/checksum are present in the application root, those are removed too.

          The updater rejects same-version/downgrade, unsafe layout, symlink, and tampered-package cases before mutation. If a failure occurs after database migration may have started, it intentionally leaves maintenance mode enabled and retains the private code backup rather than pretending an automatic database rollback is safe.

          No production server is deployed or modified by publishing this release.
          EOF_NOTES
          gh release create "$TAG" \
            "dist/$PACKAGE.zip" \
            "dist/$PACKAGE.zip.sha256" \
            "dist/$UPDATE_PACKAGE.zip" \
            "dist/$UPDATE_PACKAGE.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "MCP Gateway $TAG" \
            --notes-file dist/release-notes.md
