name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'public/css/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'public/css/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated OpenSSH transport fixture
        shell: bash
        run: |
          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server
          fi
          bash tests/Support/ssh-fixture.sh start "$GITHUB_ENV"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Validate configuration reference matches .env.example
        run: python3 bin/test-configuration-docs.py

      - name: Verify isolated Gateway and intermediary Relay host helpers
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/Support -p 'test_connection_relay_*_host.py'

      - name: Verify Relay readiness against real root-owned 0700/0755 filesystem as non-root PHP
        run: bash tests/Support/relay-readiness-filesystem-ci.sh

      - name: Check updater continuation and crash-journal guards
        run: php bin/test-update-state-guards.php

      - name: Validate immutable prerelease and public version policy
        shell: bash
        run: bash bin/test-version-policy.sh

      - name: Verify published-release upgrade coverage is consistent
        run: |
          python3 bin/test-released-baseline-parity.py
          python3 bin/test_released_baseline_parity.py

      - name: Verify fail-closed manual publication guards
        run: python3 bin/test_release_publication_guard.py

      - name: Validate release-note identity and rendered GitHub body
        shell: bash
        run: bash bin/test-github-release-notes.sh

      - name: Audit dependencies
        run: composer audit --locked

      - name: Run code style check
        run: composer lint

      - name: Run static analysis
        run: composer analyse

      - name: Run test suite
        run: composer test

      - name: Generate ephemeral Gateway OAuth signing keys
        env:
          APP_ENV: testing
        run: php artisan gateway:oauth-keygen --env=testing --force

      - name: Generate ephemeral Bridge client signing keys
        env:
          APP_ENV: testing
        run: php artisan gateway:bridge-client-keygen --env=testing --force

      - name: Validate runtime requirements
        env:
          APP_ENV: testing
          APP_KEY: base64:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mcp_gateway_test
          DB_USERNAME: mcp_gateway
          DB_PASSWORD: test-password
        run: php artisan gateway:check

      - name: Build and verify release artifacts
        run: |
          bash bin/build-release-package.sh mcp-gateway-ci
          bash bin/verify-release-package.sh dist/mcp-gateway-ci.zip mcp-gateway-ci
          bash bin/build-update-package.sh mcp-gateway-update-ci dist/mcp-gateway-ci
          bash bin/verify-update-package.sh dist/mcp-gateway-update-ci.zip

      - name: Stop isolated OpenSSH transport fixture
        if: always()
        shell: bash
        run: bash tests/Support/ssh-fixture.sh stop

  ssh-job-real-systemd:
    # Separate, disposable real-transport proof for SSH Job code.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, openssl, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare disposable, loopback-only SSH fixture
        run: |
          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server
          fi
          bash tests/Support/ssh-fixture.sh start "$GITHUB_ENV"

      - name: Real agentless systemd Job and unsupported-host acceptance
        run: bash tests/Support/ssh-job-ci-fixture.sh

      - name: Clean isolated SSH fixture
        if: always()
        run: bash tests/Support/ssh-fixture.sh stop

  connection-relay-peer-os:
    # Real OS admission policy on a disposable runner, never an operator host.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native Relay peer fixture prerequisites
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server nftables iproute2 openssl python3

      - name: Verify two restricted peers with real IPv4 and IPv6 Targets
        run: |
          sudo env MCP_RELAY_DISPOSABLE_OS_TEST=1 python3 -I tests/Support/relay-peer-os-fixture.py \
            --helper resources/host/connection-relay-peer.py \
            --artifacts artifacts/relay-peer-os

      - name: Retain bounded peer OS diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connection-relay-peer-os
          path: artifacts/relay-peer-os/
          retention-days: 7
          if-no-files-found: ignore

  managed-reverse-host-openssh:
    # Only on a disposable GitHub-hosted runner; never the Gateway's NL/IR host.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install isolated OpenSSH fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server

      - name: Verify real restricted OpenSSH control host
        run: bash tests/Support/managed-reverse-host-ci-fixture.sh

  managed-reverse-single-command-e2e:
    # Only on a disposable, isolated GitHub-hosted runner. Tests the exact
    # generated Target installer against a real local TLS claim, OpenSSH and
    # systemd; never connected to a production Gateway, Target or API key.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, openssl, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare disposable restricted OpenSSH and TLS tools
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server socat

      - name: Install exact generated Target command over real local TLS and verify Gateway SSH
        run: bash tests/Support/managed-reverse-e2e-ci-fixture.sh
