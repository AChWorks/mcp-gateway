name: Release deployment package

# Explicit Owner release action only: a VERSION change or PR merge must not
# independently publish a public artifact or move/create any release tag.
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact, independently reviewed main commit approved by Owner'
        required: true
        type: string
      approved_version:
        description: 'Approved stable VERSION (e.g. 2.1.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: mcp_gateway_test
          MARIADB_USER: mcp_gateway
          MARIADB_PASSWORD: test-password
          MARIADB_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -umcp_gateway -ptest-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate release source
        run: |
          composer validate --strict
          composer audit --locked
          composer check
          python3 bin/test-released-baseline-parity.py
          python3 bin/test_released_baseline_parity.py
          python3 bin/test_release_publication_guard.py
          bash bin/test-github-release-notes.sh

      - name: Verify explicit immutable publication envelope
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid approved SHA.' >&2; exit 1; }
          bash bin/validate-version.sh release "$APPROVED_VERSION"
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_SHA" == "$APPROVED_SHA" ]] || {
            echo 'Publication must run on the exact Owner-approved main HEAD.' >&2; exit 1;
          }
          current="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          [[ "$current" == "$APPROVED_SHA" ]] || { echo 'main moved after approval; review again.' >&2; exit 1; }
          current_version="$(tr -d '[:space:]' < VERSION)"
          [[ "$current_version" == "$APPROVED_VERSION" ]] || { echo 'Approved release version differs from checked-out source.' >&2; exit 1; }
          # v2 publishes both install and update ZIPs. The first stable v3
          # publishes only a fresh-install ZIP; it NEVER presents a v2->v3
          # update path. Both versions retain the same Owner-approved SHA,
          # immutable tag policy and byte-verification gates.
          if [[ "$APPROVED_VERSION" != 2.* && "$APPROVED_VERSION" != '3.0.0' ]]; then
            echo 'Only reviewed v2 updates or the first stable v3 fresh install are authorized by this workflow.' >&2
            exit 1
          fi
          # Later v3 releases need a separately reviewed v3-to-v3 upgrade
          # contract, or an explicit new Owner decision to remain fresh-only.

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          bash bin/validate-version.sh release "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "package=mcp-gateway-v$version" >> "$GITHUB_OUTPUT"
          echo "update_package=mcp-gateway-update-v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == 3.* ]]; then
            echo 'is_clean_v3=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_clean_v3=false' >> "$GITHUB_OUTPUT"
          fi

      # An existing or partial Release never implies success.
      - name: Require new release/tag before packaging
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        run: python3 bin/release_publication_guard.py before

      - name: Build fresh-install deployment ZIP
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: bash bin/build-release-package.sh "$PACKAGE"

      - name: Verify fresh-install deployment ZIP
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: bash bin/verify-release-package.sh "dist/$PACKAGE.zip" "$PACKAGE"

      - name: Verify clean v3 ZIP can initialize an isolated empty MariaDB database
        if: steps.release.outputs.is_clean_v3 == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          V3_RELEASE_TEST_DB_HOST: 127.0.0.1
          V3_RELEASE_TEST_DB_PORT: 3306
          V3_RELEASE_TEST_DB_DATABASE: mcp_gateway_test
          V3_RELEASE_TEST_DB_USERNAME: mcp_gateway
          V3_RELEASE_TEST_DB_PASSWORD: test-password
        run: bash bin/test-v3-fresh-install-package.sh "dist/$PACKAGE.zip" "$PACKAGE"

      - name: Verify v3 clean release rejects v2 in-place upgrading
        if: steps.release.outputs.is_clean_v3 == 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: |
          # Temporary test-only artifact. It is NEVER published by this workflow.
          bash bin/build-update-package.sh mcp-gateway-v3-update-guard-only "dist/$PACKAGE"
          bash bin/verify-update-package.sh dist/mcp-gateway-v3-update-guard-only.zip
          bash bin/test-v3-major-upgrade-guard.sh \
            "dist/$PACKAGE" dist/mcp-gateway-v3-update-guard-only.zip

      - name: Build browser update ZIP
        if: steps.release.outputs.is_clean_v3 == 'false'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
        run: bash bin/build-update-package.sh "$UPDATE_PACKAGE" "dist/$PACKAGE"

      - name: Verify browser update ZIP
        if: steps.release.outputs.is_clean_v3 == 'false'
        env:
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
        run: bash bin/verify-update-package.sh "dist/$UPDATE_PACKAGE.zip"

      - name: Download released deployment baselines
        if: steps.release.outputs.is_clean_v3 == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/baseline
          mapfile -t versions < <(python3 bin/test-released-baseline-parity.py --list)
          [[ ${#versions[@]} -eq 3 ]] || { echo "Cannot select exactly three release baselines" >&2; exit 1; }
          for version in "${versions[@]}"; do
            gh release download "v$version" \
              --pattern "mcp-gateway-v$version.zip*" \
              --dir dist/baseline
            (
              cd dist/baseline
              sha256sum --check --strict "mcp-gateway-v$version.zip.sha256"
            )
          done

      - name: Verify released-baseline browser updates
        if: steps.release.outputs.is_clean_v3 == 'false'
        env:
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
          UPDATE_TEST_DB_HOST: 127.0.0.1
          UPDATE_TEST_DB_PORT: 3306
          UPDATE_TEST_DB_DATABASE: mcp_gateway_test
          UPDATE_TEST_DB_USERNAME: mcp_gateway
          UPDATE_TEST_DB_PASSWORD: test-password
          UPDATE_TEST_REQUIRE_PROTECTED_PUBLIC: '1'
        run: |
          mapfile -t versions < <(python3 bin/test-released-baseline-parity.py --list)
          [[ ${#versions[@]} -eq 3 ]] || { echo "Cannot select exactly three release baselines" >&2; exit 1; }
          for version in "${versions[@]}"; do
            bash bin/test-update-package.sh \
              "dist/$UPDATE_PACKAGE.zip" \
              "dist/baseline/mcp-gateway-v$version.zip"
          done

      - name: Verify released-baseline backup integrity fail-safe
        if: steps.release.outputs.is_clean_v3 == 'false'
        env:
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
          UPDATE_TEST_DB_HOST: 127.0.0.1
          UPDATE_TEST_DB_PORT: 3306
          UPDATE_TEST_DB_DATABASE: mcp_gateway_test
          UPDATE_TEST_DB_USERNAME: mcp_gateway
          UPDATE_TEST_DB_PASSWORD: test-password
        run: |
          mapfile -t versions < <(python3 bin/test-released-baseline-parity.py --list)
          [[ ${#versions[@]} -eq 3 ]] || { echo "Cannot select exactly three release baselines" >&2; exit 1; }
          for version in "${versions[@]}"; do
            bash bin/test-update-backup-integrity.sh \
              "dist/$UPDATE_PACKAGE.zip" \
              "dist/baseline/mcp-gateway-v$version.zip"
          done

      - name: Publish legacy-v2 GitHub release
        if: steps.release.outputs.is_clean_v3 == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.release.outputs.package }}
          UPDATE_PACKAGE: ${{ steps.release.outputs.update_package }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        shell: bash
        run: |
          set -euo pipefail
          bash bin/render-github-release-notes.sh "$VERSION" RELEASE_NOTES.md dist/release-notes.md
          cat >> dist/release-notes.md <<EOF_NOTES

          MCP Gateway v$VERSION ships two verified operator artifacts built from the same production runtime tree.

          ## Fresh installation

          Download \`$PACKAGE.zip\`, upload/extract it on an HTTPS PHP 8.5 + MariaDB 12.3 host (primary CI-validated runtime; older PHP 8.4.1+/MariaDB or MySQL combinations require separate verification), point the domain document root to the extracted \`public/\` directory, then open \`/install\`.

          ## Supported direct upgrade window

          Direct browser updates are verified only from the three most recent
          preceding stable releases. Older installations need a verified intermediate
          upgrade or separately approved backup-and-migration path.

          ## Simple browser update

          Existing deployment-ZIP installations can update without SSH, Git, or Composer:

          1. Download \`$UPDATE_PACKAGE.zip\`.
          2. Upload it into the existing MCP Gateway application root — the directory containing \`.env\`, \`artisan\`, \`public/\`, and \`storage/\`.
          3. Extract the ZIP **in that application root**. Extraction only adds temporary \`update/\` and \`public/update/\` staging files; it does not replace the live application yet.
          4. Open \`https://your-gateway.example/update/\` in a browser.
          5. Sign in with the existing Gateway administrator account if prompted, review the preflight, and click **Update MCP Gateway**.

          The browser updater verifies the package and target, preserves \`.env\`, persistent \`storage/\`, and unknown/host-managed files under \`public/\`, creates and cryptographically validates a bounded private code backup before maintenance mode, replaces only Gateway-managed paths deterministically, verifies both the recovery backup and installed runtime again before migration, clears Laravel caches, applies migrations, runs \`gateway:check\`, returns the Gateway to service, and removes its temporary \`update/\` + \`public/update/\` staging automatically after success. When the canonical uploaded ZIP/checksum are present in the application root, those are removed too.

          The updater rejects same-version/downgrade, unsafe layout, symlink, and tampered-package cases before mutation. If the recovery backup fails integrity validation before migration, automatic restore is not attempted from that rejected backup and the application remains in maintenance mode with recovery evidence retained. If a failure occurs after database migration may have started, it intentionally leaves maintenance mode enabled and retains the private code backup rather than pretending an automatic database rollback is safe.

          No production server is deployed or modified by publishing this release.
          EOF_NOTES
          # Atomic create-if-absent tag reservation binds publication to the
          # exact approved SHA. Conflicting tags fail *before* public Release.
          # A tag-only reservation on later failure is manual reconciliation;
          # never delete/move or automatically retry that tag.
          python3 bin/release_publication_guard.py reserve
          gh release create "$TAG" \
            "dist/$PACKAGE.zip" \
            "dist/$PACKAGE.zip.sha256" \
            "dist/$UPDATE_PACKAGE.zip" \
            "dist/$UPDATE_PACKAGE.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$APPROVED_SHA" \
            --title "MCP Gateway $TAG" \
            --notes-file dist/release-notes.md

      - name: Publish clean-v3 fresh-install-only GitHub release
        if: steps.release.outputs.is_clean_v3 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.release.outputs.package }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        shell: bash
        run: |
          set -euo pipefail
          bash bin/render-github-release-notes.sh "$VERSION" RELEASE_NOTES.md dist/release-notes.md
          cat >> dist/release-notes.md <<EOF_NOTES

          ## Fresh installation only — first stable v3

          This Release contains exactly one verified deployment-ready archive
          `$PACKAGE.zip` and its `.sha256` companion. It is a **new installation**
          using a **dedicated, empty database**, not an upgrade of any v2 install.
          There is **NO v2-to-v3 or same-version browser-update ZIP** in this Release.

          1. Verify the published ZIP checksum.
          2. Take an independently restorable backup of the existing v2 code,
             database, private `.env`, encryption and OAuth signing keys before
             any separately authorized deployment/cutover. Publishing does not
             change an installed host or revoke any existing credentials.
          3. Extract `$PACKAGE.zip` into a private application directory on
             a compatible HTTPS PHP 8.5/MariaDB host. Point the site document
             root **only** to `public/`; do not expose the application root.
          4. Use `/install` with a **new empty database** to create keys,
             schema and Owner. Confirm the post-install lock, `/up`, Owner
             sign-in, scheduler and allowed Targets/Clients before accepting
             new effects. Do not run the v2 `/update/` process for this cutover.

          **A fresh v3 installation does not migrate historical v2 Users, Target
          credentials, OAuth/Bridge grants or SSH Jobs.** Any manual re-enrollment,
          DNS cutover or rollback to the independent v2 backup needs separate
          Owner authorization and a documented reconciliation plan. Refer to
          the v3 acceptance Issue #330 and docs/DEPLOYMENT.md for exact gates.

          No production server is deployed or modified by publishing this Release.
          EOF_NOTES
          # Preserve the existing tag-once and partial-publication safeguards.
          python3 bin/release_publication_guard.py reserve
          gh release create "$TAG" \
            "dist/$PACKAGE.zip" \
            "dist/$PACKAGE.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$APPROVED_SHA" \
            --title "MCP Gateway $TAG" \
            --notes-file dist/release-notes.md

      # Verify exact published bytes: v2 four assets, first-v3 two assets.
      - name: Verify published tag and exact release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        run: python3 bin/release_publication_guard.py after
